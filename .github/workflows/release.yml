name: Release

# OIDC trusted publishing; production publishing requires a matching version tag.
# See docs/en/releasing.md for environment protections and first-time setup.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Index to publish to (PyPI requires a version tag)
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.target || 'pypi' }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Validate release reference before building
        env:
          PUBLISH_TARGET: ${{ inputs.target || 'pypi' }}
        run: python tools/check_release.py
      - name: Install
        run: python -m pip install --upgrade pip build twine && python -m pip install -e ".[dev]"
      - name: Quality gates
        run: |
          ruff check --output-format=github .
          ruff format --check .
          mypy
          python tools/check_catalogues.py
          python -m pytest --cov --cov-report=term-missing
      - name: Remove generated catalogues to test the build hook
        run: python -c "from pathlib import Path; [p.unlink() for p in Path('src/komandaro/locale').rglob('*.mo')]"
      - name: Build and check distributions
        run: |
          python -m build
          twine check --strict dist/*
          python tools/check_dist.py
          python tools/smoke_wheel.py
      - if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/komandaro
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' || inputs.target == 'pypi')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/komandaro
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
