name: Release

# Publishes the package with PyPI "trusted publishing" (OIDC): no API token
# is stored anywhere. One-time setup is described in docs/en/releasing.md.
#
#   git tag v0.2.1 && git push --tags     -> tests, build, publish to PyPI
#   Actions > Release > Run workflow      -> same, to TestPyPI (dry run) or PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Index to publish to
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: Test & build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip build twine && pip install -e ".[dev]"
      - name: Tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match pyproject.toml version $version"
            exit 1
          fi
      - name: Test suite
        run: python -m pytest -q
      - name: Compile catalogues
        run: pybabel compile -d src/komandaro/locale -D komandaro --statistics
      - name: Build sdist and wheel
        run: python -m build
      - name: Check metadata and contents
        run: |
          twine check --strict dist/*
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          mo = [n for n in names if n.endswith(".mo")]
          assert len(mo) >= 3, f"compiled catalogues missing from the wheel: {names}"
          assert any(n.endswith("py.typed") for n in names), "py.typed missing"
          print("wheel ok:", *mo, sep="\n  ")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/komandaro
    permissions:
      id-token: write # mandatory for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/komandaro
    permissions:
      id-token: write # mandatory for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
