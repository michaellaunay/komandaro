name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check --output-format=github .
      - name: Ruff (format)
        run: ruff format --check .
      - name: mypy
        run: mypy

  i18n:
    name: Translation catalogues
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Catalogues compile without error
        run: pybabel compile -d src/komandaro/locale -D komandaro --statistics
      - name: .pot is up to date with the sources
        run: |
          pybabel extract -F babel.cfg -o /tmp/fresh.pot src
          # compare message ids only (ignore creation date and header)
          diff <(grep '^msgid' src/komandaro/locale/komandaro.pot) <(grep '^msgid' /tmp/fresh.pot) \
            || { echo "::error::komandaro.pot is stale: run 'pybabel extract -F babel.cfg -o src/komandaro/locale/komandaro.pot src'"; exit 1; }

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Compile catalogues
        run: pybabel compile -d src/komandaro/locale -D komandaro
      - name: Tests with coverage
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  build:
    name: Build sdist & wheel
    runs-on: ubuntu-latest
    needs: [lint, test, i18n]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install babel and compile catalogues
        run: python -m pip install --upgrade pip build babel && pybabel compile -d src/komandaro/locale -D komandaro
      - name: Build
        run: python -m build
      - name: Wheel ships the compiled catalogues
        run: python -c "import zipfile,glob,sys; n=[x for x in zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist() if x.endswith('.mo')]; print(n); sys.exit(0 if len(n)>=3 else 1)"
      - name: Check metadata
        run: python -m pip install twine && twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
