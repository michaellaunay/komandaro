[build-system]
requires = ["hatchling>=1.27", "babel>=2.14"]
build-backend = "hatchling.build"

[project]
name = "komandaro"
version = "0.4.0"
description = "Python Command pattern toolkit with undo/redo, macros, schemas, permissions and internationalisation."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Michaël Launay" }]
keywords = [
  "command-pattern",
  "undo",
  "redo",
  "macros",
  "schemas",
  "permissions",
  "i18n",
  "gettext",
  "zope.interface",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["zope.interface>=6.0", "zope.schema>=7.0"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "babel>=2.14",
  "ruff==0.16.8",
  "mypy>=1.10",
  "pre-commit>=3",
]

[project.urls]
Homepage = "https://github.com/michaellaunay/komandaro"
Repository = "https://github.com/michaellaunay/komandaro"
Issues = "https://github.com/michaellaunay/komandaro/issues"
Changelog = "https://github.com/michaellaunay/komandaro/blob/main/CHANGELOG.md"
Documentation = "https://github.com/michaellaunay/komandaro/tree/main/docs"

[tool.hatch.build]
# The custom hook compiles git-ignored catalogues for every build.
artifacts = ["src/komandaro/locale/*/LC_MESSAGES/*.mo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/komandaro"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "CHANGELOG.md", "LICENSE", "babel.cfg", "hatch_build.py", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests", "README.md", "docs"]
addopts = "--doctest-glob=*.md --doctest-modules -p no:cacheprovider"
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["komandaro"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # accented characters in French strings

[tool.ruff.lint.per-file-ignores]
"src/komandaro/interfaces.py" = ["N805"]  # zope interface methods have no self
"tests/*" = ["N806"]  # command classes built inside tests keep CamelCase
"examples/*" = ["N806"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src/komandaro"]

[[tool.mypy.overrides]]
# zope.interface classes are untyped by nature
module = "komandaro.interfaces"
ignore_errors = true
