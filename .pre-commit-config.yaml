# Install the development extra before using the local hooks.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        pass_filenames: false
        files: ^src/
      - id: catalogues
        name: gettext identifiers and placeholders
        entry: python tools/check_catalogues.py
        language: system
        pass_filenames: false
        files: ^(src/|examples/|tools/check_catalogues\.py|babel\.cfg)
